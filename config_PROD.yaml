# config.yaml

paths:
  root: C:/github/Tree-Canopy-Detection
  #root: "./"
  dataset_selector: "data1"


  train_images: "src/data/data1/train_images"
  train_masks: "src/data/data1/train_masks"
  train_images_zip: "src/data/data1/train_images.zip"

  eval_images: "src/data/data1/evaluation_images"
  eval_masks: "src/data/data1/evaluation_masks"

  models: "checkpoints"
  notebooks: "notebooks"

  annotations: "src/data/data1/train_annotations.json"

  data: "data"

  plots: "plots"

train:
  #for code PROD
  image_size: 128 #512
  num_workers: 2 # ✓ 2 CPU threads pre-load data
  seed: 42
  batch_size: 2  # Critical for 2GB GPU
  epochs: 50
  learning_rate: 1e-5
  early_stop_patience: 5 # Stop if no improvement for 5 epochs
  scheduler_factor: 0.5
  scheduler_patience: 3


extra:
  log_predictions: true
  use_amp: true


