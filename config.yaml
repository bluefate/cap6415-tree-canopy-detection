  #for code PROD
  image_size: 256
  num_workers: 2 # ✓ 2 CPU threads pre-load data
  seed: 42
  batch_size: 2 # 2 Critical for 2GB GPU
  epochs: 30
  learning_rate: 1e-4
  early_stop_patience: 8 # Stops training entirely if validation loss doesn't improve for N epochs [10-15 (gives more chances)]
  scheduler_patience: 3 # Reduces learning rate if validation loss doesn't improve for N epochs [3-5 (reduce LR earlier to recover)]
  scheduler_factor: 0.5


# early_stop_patience vs scheduler_patience
# If both are 5, the LR drops at epoch 5, then training stops at epoch 10.
# Better would be LR drops at epoch 5, stops at epoch 12-13, giving the lower LR a few epochs to work.

extra:
  log_predictions: true
  use_amp: true


