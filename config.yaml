# config.yaml

paths:
  root: C:/github/Tree-Canopy-Detection
  #root: "./"
  dataset_selector: "data1"


  train_images: "src/data/data1/train_images"
  train_masks: "src/data/data1/train_masks"
  train_images_zip: "src/data/data1/train_images.zip"

  eval_images: "src/data/data1/evaluation_images"
  eval_masks: "src/data/data1/evaluation_masks"
  eval_images_zip: "src/data/data1/evaluation_images.zip"


  models: "checkpoints"
  notebooks: "notebooks"

  annotations: "src/data/data1/train_annotations.json"

  data: "data"

  plots: "plots"

train:
  #  #for code TESTING
  image_size: 224 #64
  num_workers: 2 # 0# ✓ Single-threaded (stable)
  seed: 42
  batch_size: 8  # ⚡ Quick test under 2GB GPU
  epochs: 2  # ⚡ Quick test
  learning_rate: 1e-2
  early_stop_patience: 2 # Stops training entirely if validation loss doesn't improve for N epochs [10-15 (gives more chances)]
  scheduler_patience: 3 # Reduces learning rate if validation loss doesn't improve for N epochs [3-5 (reduce LR earlier to recover)]
  scheduler_factor: 0.5

  #for code PROD
#  image_size: 512
#  num_workers: 2 # ✓ 2 CPU threads pre-load data
#  seed: 42
#  batch_size: 8 # 2Critical for 2GB GPU
#  epochs: 2
#  learning_rate: 1e-5
#  early_stop_patience: 10 # Stops training entirely if validation loss doesn't improve for N epochs [10-15 (gives more chances)]
#  scheduler_patience: 3 # Reduces learning rate if validation loss doesn't improve for N epochs [3-5 (reduce LR earlier to recover)]
#  scheduler_factor: 0.5


# early_stop_patience vs scheduler_patience
# If both are 5, the LR drops at epoch 5, then training stops at epoch 10.
# Better would be LR drops at epoch 5, stops at epoch 12-13, giving the lower LR a few epochs to work.

extra:
  log_predictions: true
  use_amp: true


