# Dataset lives under top-level data/ (src/data/ is the Python package only).
# Active train block = local testing. Uncomment the Colab preset when needed.

paths:
  data: "data"
  annotations: "data/train_annotations.json"
  template: "data/sample_answer.json"

  train_images: "data/train_images"
  train_masks: "data/train_masks"
  train_images_zip: "data/train_images.zip"

  eval_images: "data/evaluation_images"
  eval_masks: "data/evaluation_masks"
  eval_images_zip: "data/evaluation_images.zip"

  models: "checkpoints"
  notebooks: "notebooks"
  plots: "plots"

train:
  # --- testing (active) ---
  image_size: 64
  batch_size: 3
  num_workers: 1
  epochs: 10
  learning_rate: 4e-4
  seed: 42
  early_stop_patience: 10
  scheduler_patience: 3
  scheduler_factor: 0.5

  # --- (swap with testing when training for real) ---
  # image_size: 512
  # batch_size: 8
  # num_workers: 8
  # epochs: 100
  # learning_rate: 5e-4
  # seed: 42
  # early_stop_patience: 10
  # scheduler_patience: 3
  # scheduler_factor: 0.5

# Prefer scheduler_patience < early_stop_patience so LR can drop before training stops.

extra:
  log_predictions: true
  use_amp: true
